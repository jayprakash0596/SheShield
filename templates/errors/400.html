{% extends "base.html" %}
{% block title %}400 Bad Request — SheShield{% endblock %}
{% block content %}
<div class="card" style="text-align: center; max-width: 600px; margin: 40px auto; padding: 48px 24px;">
  <div style="font-size: 3.5rem; margin-bottom: 16px;">⚠️</div>
  <h1 style="font-size: 1.8rem; color: var(--color-warning); margin-bottom: 12px;">Bad Request (400)</h1>
  <p style="color: var(--text-muted); margin-bottom: 24px;">
    The request could not be processed due to invalid parameters or an expired CSRF session token. Please reload the page and try again.
  </p>
  <div style="display: flex; gap: 12px; justify-content: center;">
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Home</a>
  </div>
</div>
{% endblock %}
